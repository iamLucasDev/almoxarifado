## Spring data

## Define o endereço e o nome do banco H2 em memória.
spring.datasource.url=jdbc:h2:mem:almoxarifado

spring.application.name=almoxarifado
spring.datasource.username =admin
spring.datasource.password = 123

##Informa a classe do driver JDBC do H2.
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.platform=h2

## JPA
##informa o dialeto SQL utilizado pelo Hibernate para trabalhar com o H2. Em geral, ele consegue detectar isso automaticamente.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

## Mensagem de erro
server.error.include-message=always 